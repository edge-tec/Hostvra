name: Hostvra Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-api:
    name: Test Go API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: apps/api/go.sum

      - name: Run API Tests with Race Detector
        working-directory: apps/api
        run: go test -v -race ./...

  test-agent:
    name: Test Go Node Agent
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: apps/agent/go.sum

      - name: Run Agent Tests with Race Detector
        working-directory: apps/agent
        run: go test -v -race ./...

  build-web:
    name: Build Next.js Web UI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build and Typecheck Next.js
        working-directory: apps/web
        run: npm run build

  cross-compile:
    name: Cross Compile Linux Binaries
    runs-on: ubuntu-latest
    needs: [test-api, test-agent]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Linux amd64 & arm64 Binaries
        run: |
          mkdir -p bin
          cd apps/api && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../../bin/hostvra-api-linux-amd64 ./cmd/server
          cd apps/api && CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o ../../bin/hostvra-api-linux-arm64 ./cmd/server
          cd ../agent && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../../bin/hostvra-agent-linux-amd64 ./cmd/agent
          cd ../agent && CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o ../../bin/hostvra-agent-linux-arm64 ./cmd/agent
          ls -lh ../../bin/
